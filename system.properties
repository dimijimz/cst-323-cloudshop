# JDK version for the Heroku Java buildpack.
#
# Without this file the buildpack selects its own default JDK, which is not
# guaranteed to be 17. The POM compiles to release 17 (<java.version>17</java.version>),
# so a buildpack default below that fails at boot with UnsupportedClassVersionError -
# after a successful build, which makes it an unpleasant failure to trace.
#
# Keep this in step with <java.version> in pom.xml and with the Java SE runtime
# selected for Azure App Service.

java.runtime.version=17
