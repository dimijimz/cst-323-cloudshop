# Test-only overrides, layered on top of the "h2" profile. Every Spring test runs
# with both profiles active: "h2" supplies the in-memory database in MySQL mode,
# and Flyway builds it from the real migrations, so the suite exercises the same
# DDL that production runs. Nothing here generates schema.

# Blank on purpose. The developer running the suite may well have OWNER_USERNAME
# and OWNER_PASSWORD exported for a local run; without these two lines the
# startup initializer would create an owner inside the tests' database and the
# "a fresh database has no accounts" assertions would depend on the shell.
app.owner.username=
app.owner.password=

spring.thymeleaf.cache=false

logging.level.root=WARN
logging.level.edu.gcu.cst323.cloudshop=INFO
