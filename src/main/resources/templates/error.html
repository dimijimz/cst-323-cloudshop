<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!--/*
  Spring Boot resolves this automatically for any error status it answers itself,
  and GlobalExceptionHandler renders it directly for a missing product, an unusable
  request value and an unexpected failure.

  This is a Thymeleaf parser-level comment, so it is removed when the page is
  rendered: an error page should not name the classes behind it.
*/-->
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container">
    <div class="card shadow-sm">
        <div class="card-body text-center py-5">
            <h1 class="display-6" th:text="${status} ?: 'Error'">404</h1>
            <p class="lead" th:text="${error} ?: 'Something went wrong.'">Not Found</p>
            <p class="text-muted" th:if="${status == 403}">
                Your account does not have access to that page.
            </p>
            <p class="text-muted" th:if="${message != null and status != 403}" th:text="${message}"></p>
            <a class="btn btn-primary" th:href="@{/products}">Back to the catalog</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
