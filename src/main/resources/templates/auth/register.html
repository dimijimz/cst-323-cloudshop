<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Register')}"></head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">

            <h1 class="h3 mb-2">Create a buyer account</h1>
            <p class="text-muted mb-4">Every account created here is a buyer account.</p>

            <div class="card shadow-sm">
                <div class="card-body">
                    <form th:action="@{/register}" th:object="${registrationForm}" method="post" novalidate>

                        <!-- Lives inside the form: #fields resolves against the enclosing th:object. -->
                        <div th:if="${#fields.hasAnyErrors()}" class="alert alert-danger">
                            Please correct the highlighted fields below.
                        </div>

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" autocomplete="username"
                                   th:field="*{username}"
                                   th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{username}">Username error</div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" class="form-control" autocomplete="email"
                                   th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{email}">Email error</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" autocomplete="new-password"
                                   th:field="*{password}"
                                   th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{password}">Password error</div>
                            <div class="form-text">At least 8 characters.</div>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label">Confirm password</label>
                            <input type="password" id="confirmPassword" class="form-control" autocomplete="new-password"
                                   th:field="*{confirmPassword}"
                                   th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'">
                            <div class="invalid-feedback" th:errors="*{confirmPassword}">Confirmation error</div>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">Create account</button>
                            <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>

            <p class="text-muted small mt-3">
                Already have an account? <a th:href="@{/login}">Sign in.</a>
            </p>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
