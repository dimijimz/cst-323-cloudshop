<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Sign in')}"></head>
<body class="bg-body-tertiary">

<nav th:replace="~{fragments/layout :: navbar('')}"></nav>

<main class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <h1 class="h3 mb-4">Sign in</h1>

            <!-- Spring Security redirects back here with one of these query parameters. -->
            <div th:if="${param.error}" class="alert alert-danger" role="alert">
                Invalid username or password.
            </div>
            <div th:if="${param.logout}" class="alert alert-success" role="alert">
                You have been signed out.
            </div>
            <div th:if="${param.registered}" class="alert alert-success" role="alert">
                Account created. Sign in to start shopping.
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <!--
                      Posts to /login, which Spring Security handles itself. The field
                      names "username" and "password" are the ones it expects.
                    -->
                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" name="username" class="form-control"
                                   autocomplete="username" required autofocus>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" name="password" class="form-control"
                                   autocomplete="current-password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Sign in</button>
                    </form>
                </div>
            </div>

            <p class="text-muted small mt-3">
                New here? <a th:href="@{/register}">Create a buyer account.</a>
            </p>

        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>

</body>
</html>
