<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--
  Shared page furniture. Every page pulls in these fragments so the views stay
  consistent without a templating engine beyond plain Thymeleaf.
  Bootstrap 5 is loaded from a CDN, which keeps the deployable jar small and
  identical across cloud targets.
-->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | CloudShop'">CloudShop</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>

<body>

<!--
  The links offered depend on who is signed in. This is a convenience, not the
  access control: SecurityConfig enforces the same rules on the server, so hiding
  a link here is never what keeps a buyer out of /owner.
-->
<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">CloudShop</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav"
                aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"
                       th:classappend="${active == 'home'} ? 'active'">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/products}"
                       th:classappend="${active == 'products'} ? 'active'">Products</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('BUYER')">
                    <a class="nav-link" th:href="@{/my-purchases}"
                       th:classappend="${active == 'purchases'} ? 'active'">My Purchases</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('OWNER')">
                    <a class="nav-link" th:href="@{/owner/products}"
                       th:classappend="${active == 'inventory'} ? 'active'">Inventory</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('OWNER')">
                    <a class="nav-link" th:href="@{/owner/sales}"
                       th:classappend="${active == 'sales'} ? 'active'">Sales</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAnonymous()">
                <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Sign in</a>
                <a class="btn btn-primary btn-sm" th:href="@{/register}">Register</a>
            </div>

            <div class="d-flex align-items-center gap-2" sec:authorize="isAuthenticated()">
                <span class="navbar-text small">
                    Signed in as <strong sec:authentication="name">username</strong>
                    <span class="badge text-bg-info" sec:authorize="hasRole('BUYER')">Buyer</span>
                    <span class="badge text-bg-warning" sec:authorize="hasRole('OWNER')">Owner</span>
                </span>
                <!-- Sign-out is a POST form: Spring Security requires the CSRF token for it. -->
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Sign out</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<!-- One-time banners shown after a redirect: green for success, red for a refusal. -->
<div th:fragment="flash" class="container">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}">Saved.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}">Something went wrong.</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
</div>

<footer th:fragment="footer" class="container border-top mt-5 py-3 text-muted small">
    <span>CST-323 Cloud Computing &middot; CloudShop &middot; Spring Boot, Spring Security and MySQL</span>
</footer>

<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
