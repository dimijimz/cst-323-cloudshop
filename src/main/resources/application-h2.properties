# ---------------------------------------------------------------------------
# "h2" profile - an in-memory H2 database in MySQL compatibility mode.
#
# Used by the test suite and for running the shop on a machine that has no
# MySQL (and no working Docker). Activate it with either of:
#   SPRING_PROFILES_ACTIVE=h2
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
#
# The MySQL migrations stay authoritative: Flyway runs the very same
# V1__create_schema.sql and V2__seed_data.sql against H2 that it runs against
# MySQL, and Hibernate still only validates. Nothing in this profile generates
# schema, so a mapping that drifts from the migrations fails here too.
#
# The database lives in memory. Every restart begins from the seed data again:
# the products come back, and registered buyers and their purchases are gone.
#
# MODE=MySQL                         accept MySQL DDL (ENGINE=, DEFAULT CHARSET=, ...)
# DATABASE_TO_LOWER=TRUE             store identifiers lower-case, as MySQL does
# CASE_INSENSITIVE_IDENTIFIERS=TRUE  match them without regard to case
# DB_CLOSE_DELAY=-1                  keep the database alive while the JVM runs
# ---------------------------------------------------------------------------

spring.datasource.url=jdbc:h2:mem:cloudshop;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
# An explicit empty value, which is what satisfies RequiredDatabasePasswordValidator:
# the in-memory database has no password, and saying so is different from forgetting.
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
