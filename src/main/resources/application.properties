# ---------------------------------------------------------------------------
# CloudShop - CST-323 Cloud Computing
#
# Every environment-specific value below is read from an environment variable.
# Nothing here needs to change to move the application between cloud platforms:
# set the variables on the platform instead (Azure App Service application
# settings, Heroku config vars, container env vars, and so on).
#
# DB_PASSWORD deliberately has NO default. A committed fallback password would
# let a misconfigured deployment start up and then fail at connection time with
# an opaque "access denied" error that blames the database rather than the
# configuration. Note that removing the default is not enough on its own: the
# binder ignores unresolvable placeholders and would pass the literal text
# "${DB_PASSWORD}" to the driver, so RequiredDatabasePasswordValidator enforces
# it at startup. Every other database setting keeps a local development default
# after the colon, because none of them are credentials.
#
# The "h2" profile (application-h2.properties) swaps the datasource for an
# in-memory H2 database in MySQL mode, for tests and for running on a machine
# with no MySQL. It runs the same Flyway migrations as MySQL does.
# ---------------------------------------------------------------------------

spring.application.name=cloudshop

# Many PaaS hosts inject the port they expect the app to listen on.
server.port=${PORT:8080}

# --- Database -------------------------------------------------------------
# DB_SSL_MODE is DISABLED for a local MySQL; managed MySQL services such as
# Azure Database for MySQL Flexible Server require REQUIRED.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cloudshopdb}?sslMode=${DB_SSL_MODE:DISABLED}&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:cloudshop_app}
# Required. Export it, or pass -DDB_PASSWORD=... ; there is no fallback by design.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Conservative pool sizing: managed database tiers cap connections aggressively.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:20000}

# --- JPA ------------------------------------------------------------------
# Flyway owns the schema, so Hibernate only verifies that the mapping matches.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# --- Flyway ---------------------------------------------------------------
# Creates the schema and seed data the first time the app meets an empty database,
# then records what it applied so redeploys are safe to repeat.
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
# Deliberately false. When this is true and Flyway meets a database that already
# has tables but no flyway_schema_history, it writes a baseline row and SKIPS V1
# instead of applying it. A deployment pointed at the wrong database would then
# start up looking healthy while the schema it expects was never created. False
# turns that into a refusal to start.
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}

# --- Owner account --------------------------------------------------------
# The shop has exactly one owner, and it cannot be created through /register.
# OwnerAccountInitializer creates it at startup from these two variables when no
# owner exists yet. Neither has a default: a committed owner password would be a
# published credential. With both unset the shop still runs, but nobody can sign
# in as the owner, and a WARN line at startup says so.
app.owner.username=${OWNER_USERNAME:}
app.owner.password=${OWNER_PASSWORD:}
# users.email is NOT NULL and unique, so the owner row needs an address too.
app.owner.email=${OWNER_EMAIL:owner@cloudshop.local}

# --- Templates ------------------------------------------------------------
# Cached by default; spring-boot-devtools disables this automatically when running locally.
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# --- Error pages ----------------------------------------------------------
server.error.include-message=always
server.error.whitelabel.enabled=false

# --- Health and monitoring ------------------------------------------------
# /health          - lightweight liveness probe implemented by HealthController,
#                    never touches the database
# /actuator/health - readiness probe; its status reflects database connectivity
#
# Only health and info are exposed, and health never shows component detail.
# These are fixed rather than read from the environment on purpose: both
# endpoints are reachable without signing in, so widening them should take a
# code change that someone reviews, not a config var that someone forgets.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=true
management.info.env.enabled=true
info.app.name=CloudShop
info.app.course=CST-323 Cloud Computing

# spring-boot-devtools switches the H2 web console on by default. It would sit
# behind the login, but any signed-in buyer could then reach a SQL prompt on the
# "h2" profile, so it is pinned off.
spring.h2.console.enabled=false

# --- Logging --------------------------------------------------------------
# Registrations, purchases and inventory changes are logged at INFO by the
# service layer. Console only - see logback-spring.xml.
logging.level.root=WARN
logging.level.org.springframework=INFO
logging.level.edu.gcu.cst323.cloudshop=${APP_LOG_LEVEL:INFO}
# Flyway logs which migrations it applied at INFO. Without this line the WARN root
# level swallows them, and a cloud deployment leaves no record of what it did to the
# schema - the one thing you want in the log when a release goes wrong.
logging.level.org.flywaydb=${FLYWAY_LOG_LEVEL:INFO}
