# Replaces Spring's default type-conversion errors, which quote Java class names
# at the user, with plain wording. Used when a form field holds something that is
# not a number at all - for example letters in the price or quantity box.
typeMismatch.java.math.BigDecimal=Enter a number, such as 19.99
typeMismatch.java.lang.Integer=Enter a whole number
typeMismatch=That value is not valid
