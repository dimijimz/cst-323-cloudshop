# Maven Wrapper configuration.
# distributionType=only-script means no maven-wrapper.jar is committed to the repo;
# the wrapper script downloads Maven itself on first use. Keeps the repo binary-free
# and portable across build agents on any cloud platform.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
